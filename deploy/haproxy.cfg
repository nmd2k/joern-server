global
  log stdout format raw local0
  maxconn 4096

defaults
  mode http
  log global
  option httplog
  option dontlognull
  timeout connect 10s
  timeout client  3600s
  timeout server  3600s
  retries 2

# Port 8080 — Joern HTTP proxy (compose.scale.yml)
#
# Sticky routing by X-Affinity-Key (sample_id): REPL holds loaded CPG in memory.
# Fallback: X-Session-Id, then client IP.
# Close the server leg after every response so keep-alive connections can still
# be re-routed when the session key changes.
frontend fe_joern_http
  bind *:8080
  option http-server-close
  default_backend be_joern_http

backend be_joern_http
  balance roundrobin
  option http-server-close
  option httpchk GET /health
  http-check expect status 200

  # Transparently retry on another replica when one is draining (503) or restarting.
  # Clients must not see transient drain responses — HAProxy redispatches instead.
  retries 3
  retry-on 503 502 conn-failure empty-response
  option redispatch

  stick-table type string len 128 size 100k expire 2h
  http-request set-var(txn.sticky_key) req.hdr(X-Affinity-Key)
  http-request set-var(txn.sticky_key) req.hdr(X-Session-Id) if !{ var(txn.sticky_key) -m found }
  http-request set-var(txn.sticky_key) src if !{ var(txn.sticky_key) -m found }
  stick on var(txn.sticky_key)

  http-response set-header X-Served-By %[srv_name]

  # inter 2s fall 1 → mark down after one failed check (~2s). Pair with JOERN_DRAIN_SEC (default 7s).
  server-template joern 20 joern:8080 check resolvers docker init-addr libc,none inter 2s fall 1 rise 2

listen stats
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 5s

resolvers docker
  nameserver dns 127.0.0.11:53
  accepted_payload_size 8192
  hold valid    5s
  hold other   10s
  hold refused 10s
  resolve_retries 3
