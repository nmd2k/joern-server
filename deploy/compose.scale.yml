# N Joern replicas behind HAProxy with Docker DNS discovery.
#
# Usage (from repo root):
#   docker compose -f deploy/compose.scale.yml up -d --scale joern=<N>
#
# HTTP entry point (published by joern-haproxy, not by joern containers):
#   http://localhost:${JOERN_HTTP_PORT:-8080}
#
# Sticky routing: send X-Affinity-Key (sample_id) on /query-sync so REPL state stays
# on one replica. Fallback: X-Session-Id, then source IP.

networks:
  joern-net:
    driver: bridge

services:
  joern:
    image: neuralatlas-joern:${JOERN_IMAGE_TAG:-local}
    expose:
      - "8080"
    networks:
      - joern-net
    volumes:
      - ../ingest:/workspace/ingest:ro
      - joern-workspace:/workspace/joern-workspace
      - cpg-out:/workspace/cpg-out
      - cpg-archive:/workspace/cpg-archive
    environment:
      JOERN_SERVER_HOST: "0.0.0.0"
      JOERN_INTERNAL_PORT: "${JOERN_INTERNAL_PORT:-18080}"
      JOERN_QUERY_TIMEOUT_SEC: "${JOERN_QUERY_TIMEOUT_SEC:-600}"
      JOERN_JAVA_XMX: "${JOERN_JAVA_XMX:-4g}"
      JOERN_SERVER_AUTH_USERNAME: "${JOERN_SERVER_AUTH_USERNAME:-}"
      JOERN_SERVER_AUTH_PASSWORD: "${JOERN_SERVER_AUTH_PASSWORD:-}"
      PROXY_PORT: "8080"
      CPG_ARCHIVE_DIR: "${CPG_ARCHIVE_DIR:-/workspace/cpg-archive}"
      CPG_ARCHIVE_MAX_COUNT: "${CPG_ARCHIVE_MAX_COUNT:-100}"
      CPG_ARCHIVE_MAX_GB: "${CPG_ARCHIVE_MAX_GB:-50}"
      QUERY_CACHE_MAX_SIZE: "${QUERY_CACHE_MAX_SIZE:-0}"
      JOERN_MEMORY_RESTART_MB: "${JOERN_MEMORY_RESTART_MB:-3072}"
      JOERN_DRAIN_SEC: "${JOERN_DRAIN_SEC:-7}"
      JOERN_RESTART_JITTER_SEC: "${JOERN_RESTART_JITTER_SEC:-30}"
      JOERN_RESTART_MIN_PEERS: "${JOERN_RESTART_MIN_PEERS:-2}"
      JOERN_HAPROXY_VIP: "${JOERN_HAPROXY_VIP:-http://joern-haproxy:8080}"
      JOERN_ENABLE_DRAIN_TEST: "${JOERN_ENABLE_DRAIN_TEST:-0}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: "${JOERN_MEMORY_LIMIT:-8g}"
        reservations:
          memory: 2g
    healthcheck:
      test: ["CMD", "/usr/local/bin/joern-healthcheck.sh"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    labels:
      autoheal: "true"
    restart: unless-stopped

  joern-haproxy:
    image: haproxy:2.9
    container_name: joern-haproxy
    ports:
      - "${JOERN_HTTP_PORT:-8080}:8080"
      - "${HAPROXY_STATS_PORT:-8404}:8404"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - joern-net
    depends_on:
      joern:
        condition: service_started
    restart: unless-stopped

  autoheal:
    image: willfarrell/autoheal
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "${AUTOHEAL_INTERVAL:-10}"
      AUTOHEAL_START_PERIOD: "${AUTOHEAL_START_PERIOD:-180}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  joern-workspace:
  cpg-out:
  cpg-archive:
